spring.application.name=cuidaidoso

# Banco (valores padrão para rodar fora do Docker; no Docker vêm de variáveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuidaidoso}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cuida}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cuida}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Nome do ambiente exibido em GET /
app.ambiente=${APP_AMBIENTE:local}

# Mensagens de erro nas respostas da API
server.error.include-message=always

# Actuator: apenas health (usado no healthcheck do Docker e no smoke test do pipeline)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
